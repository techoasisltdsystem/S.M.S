# Security headers for Tech Oasis School (same as vercel.json). Included from every location in
# school.techoasisltd.com.conf, because nginx drops server-level add_header lines inside a location that sets its own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
