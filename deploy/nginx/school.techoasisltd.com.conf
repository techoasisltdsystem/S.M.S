# Tech Oasis School: nginx site for the VPS. Mirrors vercel.json (rewrites + security headers).
# Installed by deploy/setup-server.sh. By hand:
#   sudo ln -s /var/www/techoasis-school/deploy/nginx/school.techoasisltd.com.conf /etc/nginx/sites-enabled/school.techoasisltd.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d school.techoasisltd.com -d www.school.techoasisltd.com   (adds HTTPS and the http -> https redirect)

server {
    listen 80;
    listen [::]:80;
    server_name school.techoasisltd.com www.school.techoasisltd.com;

    # The git checkout kept up to date by deploy/deploy.sh
    root /var/www/techoasis-school;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /var/www/techoasis-school/deploy/nginx/security-headers.conf;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    # ---- Never serve repository internals or private files ----
    location ~ /\.(?!well-known/) { return 404; }   # .git, .vscode, .claude, .vercelignore, .env* (HTTPS checks still work)
    location ^~ /db/          { return 404; }      # database plan
    location ^~ /docs/        { return 404; }
    location ^~ /deploy/      { return 404; }      # these server files
    location ~* \.(md|sql|lnk|sh)$ { return 404; }
    location = /vercel.json   { return 404; }
    location = /serve.json    { return 404; }

    # ---- Portals: real paths answered by the single-page portal (same rewrites as vercel.json) ----
    location = /admin {
        include /var/www/techoasis-school/deploy/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /admin.html =404;
    }
    location ^~ /admin/ {
        include /var/www/techoasis-school/deploy/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /portal.html =404;
    }
    location ~ ^/(student|staff)(/|$) {
        include /var/www/techoasis-school/deploy/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /portal.html =404;
    }

    # ---- Caching ----
    # Pages, scripts and styles keep fixed names, so browsers check for updates on each visit (cheap 304 replies)
    location ~* \.(html|js|css|json|xml|txt)$ {
        include /var/www/techoasis-school/deploy/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    # Images and icons rarely change: cache for 30 days
    location ~* \.(png|jpe?g|webp|gif|svg|ico)$ {
        include /var/www/techoasis-school/deploy/nginx/security-headers.conf;
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
