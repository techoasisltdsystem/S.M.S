<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Check a Tech Oasis School certificate ID.">
    <title>Verify a Certificate | Tech Oasis School</title>
    <meta name="theme-color" content="#0C3B2E">
    <meta property="og:site_name" content="Tech Oasis School">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Verify a Certificate | Tech Oasis School">
    <meta property="og:description" content="Check a Tech Oasis School certificate ID.">
    <meta property="og:image" content="https://school.techoasisltd.com/brand/tech-oasis-social.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Tech Oasis School logo with the line Where Innovation Meets Expertise">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Verify a Certificate | Tech Oasis School">
    <meta name="twitter:description" content="Check a Tech Oasis School certificate ID.">
    <meta name="twitter:image" content="https://school.techoasisltd.com/brand/tech-oasis-social.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/brand/tech-oasis-app-icon.svg">
    <link rel="apple-touch-icon" href="/brand/tech-oasis-favicon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tw.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/tos.css">
    <style>
        @page { size: A4 landscape; margin: 0; }
        @media print {
            body * { visibility: hidden; }
            #certificate, #certificate * { visibility: visible; }
            #certificate { position: fixed; inset: 0; margin: 0; width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
        }
    </style>
</head>
<body class="bg-ivory text-slate-800 font-sans antialiased">
    <div id="siteHeader"></div>
    <main id="app" class="max-w-[1100px] mx-auto px-4 sm:px-6 py-10 sm:py-14"></main>
    <div id="siteFooter"></div>

    <script src="assets/js/core/ui.js"></script>
    <script src="assets/js/core/crypto.js"></script>
    <script src="assets/js/core/db.js"></script>
    <script src="assets/js/core/seed.js"></script>
    <script src="assets/js/core/lms.js"></script>
    <script src="assets/js/core/video.js"></script>
    <script src="assets/js/core/auth.js"></script>
    <script src="assets/js/core/engage.js"></script>
    <script src="assets/js/pages/chrome.js"></script>
    <script>
    (function () {
        const { db, lms, ui } = TOS, esc = ui.esc, app = document.getElementById('app');
        TOS.chrome.mount();
        const code = (ui.qs('code') || '').trim();

        const lookup = (msg) => `<div class="max-w-xl mx-auto text-center">
            <span class="w-16 h-16 mx-auto rounded-2xl bg-forest text-gold flex items-center justify-center text-2xl"><i class="fa-solid fa-shield-halved"></i></span>
            <h1 class="font-display text-4xl text-ink mt-6">Verify a certificate</h1>
            <p class="text-slate-600 mt-3">Enter the certificate ID printed on a Tech Oasis School certificate.</p>
            ${TOS.config.serverConnected ? '' : `<div class="mt-5 rounded-lg border border-amber-200 bg-amber-50 text-amber-900 text-sm p-4 text-left" role="note"><b>Verification is not online yet.</b> This page can only look up certificates stored in this browser, so it cannot confirm a certificate issued to someone else. To confirm one, email <a class="underline font-semibold" href="mailto:${esc(db.settings().school.email)}">${esc(db.settings().school.email)}</a> with the certificate ID.</div>`}
            ${msg || ''}
            <form class="mt-8 flex gap-2" onsubmit="event.preventDefault(); location.search = '?code=' + encodeURIComponent(this.code.value.trim())">
                <label for="codeIn" class="sr-only">Certificate ID</label>
                <input id="codeIn" name="code" required class="field h-12 font-mono uppercase" placeholder="Certificate ID" value="${esc(code)}" autocomplete="off">
                <button class="btn btn-forest h-12 px-6">Verify</button></form></div>`;

        if (!code) { app.innerHTML = lookup(); return; }
        const cert = lms.certificateByCode(code);
        if (!cert) { app.innerHTML = lookup(`<div class="mt-6 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-sm p-4"><i class="fa-solid fa-circle-xmark mr-1"></i>No certificate was found with ID <b class="font-mono">${esc(code)}</b>. Check the ID and try again.</div>`); return; }

        const st = db.settings(), accent = st.certificates.accent || '#C4A649', vurl = lms.verifyUrl(cert.code);
        document.title = (cert.revoked ? 'Revoked certificate' : cert.studentName + ' — ' + cert.courseTitle) + ' | Tech Oasis School';
        app.innerHTML = `
            ${ui.qs('new') === '1' && !cert.revoked ? `<div class="no-print mb-8 rounded-xl bg-gradient-to-r from-forest to-ink text-white p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center gap-5"><span class="w-14 h-14 rounded-full bg-gold text-ink flex items-center justify-center text-2xl shrink-0"><i class="fa-solid fa-champagne-glasses"></i></span><div><h1 class="font-display text-3xl">Congratulations, ${esc(cert.studentName.split(' ')[0])}!</h1><p class="text-white/75 text-sm mt-1">Your certificate is ready. Download it, add it to LinkedIn and share your achievement.</p></div></div>` : ''}
            <div class="no-print flex flex-wrap items-center justify-between gap-4 mb-6">
                <div class="flex items-center gap-3">${cert.revoked
                    ? '<span class="pill pill-revoked text-sm px-3 py-1.5"><i class="fa-solid fa-ban"></i>Revoked</span><span class="text-sm text-slate-600">This certificate is no longer valid.' + (cert.revokedReason ? ' Reason: ' + esc(cert.revokedReason) : '') + '</span>'
                    : (TOS.config.serverConnected ? '<span class="pill pill-valid text-sm px-3 py-1.5"><i class="fa-solid fa-circle-check"></i>Verified</span><span class="text-sm text-slate-600">Issued by ' + esc(cert.schoolName) + '</span>' : '<span class="pill text-sm px-3 py-1.5 bg-amber-100 text-amber-900"><i class="fa-solid fa-circle-info"></i>Found in this browser</span><span class="text-sm text-slate-600">Not independently verified: this record is stored in this browser, not on a school server. Confirm it with ' + esc(db.settings().school.email) + '.</span>')}</div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="window.print()" class="btn btn-outline btn-sm"><i class="fa-solid fa-download"></i>Download PDF</button>
                    <button id="copyLink" class="btn btn-outline btn-sm"><i class="fa-solid fa-link"></i>Copy link</button>
                    ${cert.revoked ? '' : `<a target="_blank" rel="noopener noreferrer" href="https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME&name=${encodeURIComponent(cert.courseTitle)}&organizationName=${encodeURIComponent(cert.schoolName)}&issueYear=${new Date(cert.issuedAt).getFullYear()}&issueMonth=${new Date(cert.issuedAt).getMonth() + 1}&certId=${encodeURIComponent(cert.code)}&certUrl=${encodeURIComponent(vurl)}" class="btn btn-forest btn-sm"><i class="fa-brands fa-linkedin"></i>Add to LinkedIn</a>`}
                </div>
            </div>

            <div id="certificate" class="relative bg-white rounded-2xl shadow-lift overflow-hidden ${cert.revoked ? 'grayscale opacity-70' : ''}" style="aspect-ratio: 1.414/1">
                <div class="absolute inset-3 sm:inset-5 border-2 rounded-[16px]" style="border-color:${esc(accent)}"></div>
                <div class="absolute inset-5 sm:inset-8 border rounded-[12px]" style="border-color:${esc(accent)}55"></div>
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,#FBF7EA,transparent_55%)]"></div>
                <div class="absolute -left-24 -bottom-24 w-72 h-72 rounded-full bg-forest/5"></div><div class="absolute -right-24 -top-24 w-72 h-72 rounded-full bg-gold/10"></div>
                <div class="relative h-full flex flex-col items-center justify-between text-center px-[8%] py-[6%]">
                    <div class="flex flex-col items-center">${ui.brandLogo(false, 44)}
                        <div class="text-[clamp(8px,1.2vw,12px)] tracking-[0.45em] uppercase font-bold mt-[3%]" style="color:${esc(accent)}">Certificate of Completion</div></div>
                    <div>
                        <div class="text-[clamp(10px,1.4vw,14px)] text-slate-500">This is to certify that</div>
                        <div class="font-display italic text-ink text-[clamp(26px,5vw,56px)] leading-tight mt-1">${esc(cert.studentName)}</div>
                        <div class="h-px w-1/2 mx-auto my-[2%]" style="background:linear-gradient(90deg,transparent,${esc(accent)},transparent)"></div>
                        <div class="text-[clamp(10px,1.4vw,14px)] text-slate-500">has successfully completed the programme</div>
                        <div class="font-display text-forest text-[clamp(18px,3vw,34px)] mt-1">${esc(cert.courseTitle)}</div>
                        <div class="text-[clamp(9px,1.2vw,12px)] text-slate-500 mt-1">${cert.hours ? esc(ui.plural(+cert.hours, 'hour')) + ' of study · ' : ''}Completed ${ui.fmtDate(cert.issuedAt, { day: 'numeric', month: 'long', year: 'numeric' })}</div>
                    </div>
                    <div class="w-full grid grid-cols-3 items-end text-[clamp(8px,1.1vw,12px)]">
                        <div class="text-left"><div class="font-display italic text-[clamp(12px,1.8vw,20px)] text-ink">${esc(cert.instructorName || '—')}</div><div class="h-px bg-slate-300 my-1 w-4/5"></div><div class="text-slate-500">Instructor</div></div>
                        <div class="flex justify-center"><span class="w-[clamp(44px,8vw,88px)] aspect-square rounded-full flex items-center justify-center text-white shadow-lift" style="background:radial-gradient(circle at 30% 30%, #E9D79A, ${esc(accent)} 55%, #937733)"><i class="fa-solid fa-award text-[clamp(16px,3vw,34px)]"></i></span></div>
                        <div class="text-right"><div class="font-display italic text-[clamp(12px,1.8vw,20px)] text-ink">${esc(st.certificates.signatoryName)}</div><div class="h-px bg-slate-300 my-1 w-4/5 ml-auto"></div><div class="text-slate-500">${esc(st.certificates.signatoryTitle)}</div></div>
                    </div>
                    <div class="text-[clamp(7px,.9vw,10px)] text-slate-400">Certificate ID <b class="font-mono text-slate-600">${esc(cert.code)}</b> · Verify at ${esc(vurl)}</div>
                </div>
            </div>

            <div class="no-print mt-8 grid sm:grid-cols-2 lg:grid-cols-4 gap-4 text-sm">
                ${[['Student', cert.studentName], ['Programme', cert.courseTitle], ['Issued', ui.fmtDate(cert.issuedAt)], ['Certificate ID', cert.code]].map(([k, v]) => `<div class="rounded-2xl bg-white border border-slate-200/70 p-4"><div class="text-xs text-slate-500">${k}</div><div class="font-semibold text-ink mt-1 break-words ${k === 'Certificate ID' ? 'font-mono' : ''}">${esc(v)}</div></div>`).join('')}
            </div>
            <p class="no-print text-center text-xs text-slate-400 mt-6">Questions about this certificate? Contact <a class="underline" href="mailto:${esc(st.school.email)}">${esc(st.school.email)}</a></p>`;
        if (ui.qs('print') === '1') setTimeout(() => window.print(), 600);
        document.getElementById('copyLink').onclick = () => navigator.clipboard.writeText(vurl).then(() => ui.toast('Verification link copied'), () => ui.toast(vurl));
    })();
    </script>
</body>
</html>
